<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>铁路大亨 · 动态路线预测器 v1.3.1</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101114}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="./v1.3.html"></iframe><script>(function(){const frame=document.getElementById('app');function follow(){try{const d=frame.contentDocument;if(!d)return;const route=d.getElementById('route');if(route){const now=route.querySelector('.node.now');if(now){const target=now.offsetLeft-(route.clientWidth-now.offsetWidth)/2;route.scrollTo({left:Math.max(0,target),behavior:'smooth'});}}const prediction=d.getElementById('prediction');if(prediction){const items=prediction.querySelectorAll('.pitem');items.forEach((el,i)=>{if(i>=3)el.remove();});const title=prediction.closest('.panel')?.querySelector('.title');if(title)title.textContent='⑤ 后面3站预测';}}catch(e){}}frame.addEventListener('load',function(){follow();setInterval(follow,500);});})();</script></body></html>
